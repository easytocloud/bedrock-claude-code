  /* VS Code-ish frame around the real sidebar view */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #1e1e1e; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    display: flex;
    height: 100vh;
    overflow: hidden;
  }

  /* ── Activity bar ── */
  .activitybar {
    width: 48px;
    flex: none;
    background: #181818;
    border-right: 1px solid #2a2a2a;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-top: 4px;
  }
  .ab-item {
    width: 48px;
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #7a7a7a;
    position: relative;
  }
  .ab-item.active {
    color: #e8e8e8;
  }
  .ab-item.active::before {
    content: '';
    position: absolute;
    left: 0; top: 6px; bottom: 6px;
    width: 2px;
    background: #e8e8e8;
  }
  .ab-item svg { width: 24px; height: 24px; }

  /* ── Sidebar chrome ── */
  .sidebar {
    width: 380px;
    flex: none;
    background: #1b1b22;
    display: flex;
    flex-direction: column;
  }
  .sidebar-title {
    padding: 10px 16px 6px;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #a0a0aa;
  }
  .sidebar-body { flex: 1; overflow: hidden; }

  /* Theme variables consumed by the real sidebar styles */
  :root {
    --vscode-font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --vscode-foreground: #cccccc;
    --vscode-sideBar-foreground: #cccccc;
    --vscode-sideBar-background: #1b1b22;
    --vscode-descriptionForeground: #9d9daa;
    --vscode-focusBorder: #4d78cc;
    --vscode-textLink-foreground: #4daafc;
  }

  /* ── Editor area hint (empty, subtle) ── */
  .editor {
    flex: 1;
    background: #1e1e1e;
    border-left: 1px solid #2a2a2a;
  }
</style>
