name: Release

# Publishing is tag-triggered, never merge-triggered. Merging dependency
# updates or ordinary PRs must not ship anything; a release is a deliberate
# act of tagging. Tag prefix selects the artifact, so the extension and the
# CLI can release independently on PATCH while staying in lock-step on MINOR:
#
#   ext-v0.9.2   -> publishes the VS Code extension only
#   cli-v0.9.1   -> publishes the npm CLI only
#   v0.10.0      -> publishes both (shared-engine release)
on:
  push:
    tags:
      - 'v*'
      - 'ext-v*'
      - 'cli-v*'
  workflow_dispatch:
    inputs:
      target:
        description: Which artifact to publish
        type: choice
        options: [both, extension, cli]
        default: both
      dry_run:
        description: Build and verify without publishing
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  # Decide what to publish and verify the tag matches the manifest, so a
  # mistyped tag fails before anything reaches a registry.
  plan:
    runs-on: ubuntu-latest
    outputs:
      extension: ${{ steps.decide.outputs.extension }}
      cli: ${{ steps.decide.outputs.cli }}
      dry_run: ${{ steps.decide.outputs.dry_run }}
    steps:
      - uses: actions/checkout@v4

      # Pinned rather than relying on the runner's default Node: the version
      # checks below use `node -p`, and the dry-run build must match CI.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - id: decide
        env:
          REF: ${{ github.ref_name }}
          TARGET: ${{ inputs.target }}
          DRY: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            case "$TARGET" in
              extension) ext=true;  cli=false ;;
              cli)       ext=false; cli=true  ;;
              *)         ext=true;  cli=true  ;;
            esac
            echo "dry_run=$DRY" >> "$GITHUB_OUTPUT"
          else
            case "$REF" in
              ext-v*) ext=true;  cli=false ;;
              cli-v*) ext=false; cli=true  ;;
              v*)     ext=true;  cli=true  ;;
            esac
            echo "dry_run=false" >> "$GITHUB_OUTPUT"

            # Tag must match the version in the manifest it publishes.
            version="${REF#*v}"
            if [ "$ext" = true ]; then
              manifest=$(node -p "require('./extension/package.json').version")
              [ "$manifest" = "$version" ] || {
                echo "::error::Tag $REF does not match extension version $manifest"; exit 1; }
            fi
            if [ "$cli" = true ]; then
              manifest=$(node -p "require('./cli/package.json').version")
              [ "$manifest" = "$version" ] || {
                echo "::error::Tag $REF does not match CLI version $manifest"; exit 1; }
            fi
          fi
          echo "extension=$ext" >> "$GITHUB_OUTPUT"
          echo "cli=$cli" >> "$GITHUB_OUTPUT"

      # Credential preflight. This job has no `environment:`, so it runs on any
      # ref -- which lets a workflow_dispatch from main verify that the org
      # secret reaches this repo and that the service account can read the
      # cicd vault, without publishing anything. The publish job cannot serve
      # this purpose: its `environment: release` restricts it to release tags.
      #
      # Only lengths are reported, never values.
      - name: Load credentials
        id: creds
        uses: 1password/load-secrets-action@v2
        continue-on-error: true
        with:
          export-env: false
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          VSCE_PAT: op://cicd/vsce/credential
          NPM_TOKEN: op://cicd/npm/credential

      - name: Report credential status
        shell: bash
        env:
          OP_TOKEN_SET: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN != '' }}
          LOAD_OUTCOME: ${{ steps.creds.outcome }}
          VSCE_PAT: ${{ steps.creds.outputs.VSCE_PAT }}
          NPM_TOKEN: ${{ steps.creds.outputs.NPM_TOKEN }}
        run: |
          fail=0
          if [ "$OP_TOKEN_SET" != "true" ]; then
            echo "::error::OP_SERVICE_ACCOUNT_TOKEN is empty. The org secret is not reaching this repo."
            fail=1
          else
            echo "OP_SERVICE_ACCOUNT_TOKEN: present"
          fi

          # Distinguish "the action itself failed" (network, 1Password outage,
          # bad token) from "the action ran but a reference did not resolve"
          # (vault access, wrong item/field name). Without this, an outage
          # produces empty outputs and the per-secret branch below would
          # wrongly blame vault permissions.
          if [ "$LOAD_OUTCOME" != "success" ]; then
            echo "::error::load-secrets-action did not succeed (outcome: $LOAD_OUTCOME). \
          This is an action-level failure -- check the service account token and 1Password availability \
          before suspecting vault permissions."
            fail=1
          fi

          # Indirect expansion, not eval: eval would re-interpret the secret
          # value as shell code.
          for name in VSCE_PAT NPM_TOKEN; do
            value="${!name}"
            if [ -z "$value" ]; then
              if [ "$LOAD_OUTCOME" = "success" ]; then
                echo "::error::$name did not resolve although the action succeeded. \
          Check the service account's access to the cicd vault and the item/field names."
              else
                echo "$name: unavailable (load step failed above)"
              fi
              fail=1
            else
              echo "$name: resolved (${#value} chars)"
            fi
          done
          [ "$fail" -eq 0 ] && echo "All credentials resolved." || exit 1

      # A dry run skips the publish job entirely, so build and package here to
      # prove the release would actually produce an artifact. On a real tag
      # this is redundant with the publish job and is skipped.
      - name: Build and package (dry run only)
        if: steps.decide.outputs.dry_run == 'true'
        run: |
          npm ci
          npm run build
          npm run lint
          cd extension
          npx vsce package --no-dependencies --out /tmp/dry-run.vsix
          echo "Packaged $(ls -lh /tmp/dry-run.vsix | awk '{print $5}')"

  # Skipped entirely on a dry run. The `release` environment only permits
  # v*/ext-v*/cli-v* tags, so a workflow_dispatch from main would otherwise be
  # rejected by the protection rules and mark the whole run as failed -- even
  # though the dry run did exactly what it should. Guarding here keeps a
  # successful dry run green, so a red Release run always means real trouble.
  # The credential verification a dry run exists for happens in `plan`.
  publish:
    needs: plan
    if: needs.plan.outputs.dry_run != 'true'
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci
      - run: npm run build
      - run: npm run lint

      # Pull publishing credentials from 1Password. Only the service-account
      # token lives in GitHub secrets; the PAT and npm token stay in the vault.
      - uses: 1password/load-secrets-action@v2
        id: op
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          VSCE_PAT: op://cicd/vsce/credential
          NPM_TOKEN: op://cicd/npm/credential

      # The job-level `if` already excludes dry runs, so these steps only need
      # to select the artifact.
      - name: Publish extension
        if: needs.plan.outputs.extension == 'true'
        working-directory: extension
        # --no-dependencies is required: npm workspaces hoist node_modules to
        # the repo root, which makes vsce walk out of the package directory.
        # All runtime deps are esbuild-bundled, so the VSIX needs none of it.
        run: npx vsce publish --no-dependencies --pat "$VSCE_PAT"

      # NODE_AUTH_TOKEN is assigned from the shell, not a ${{ env.* }}
      # expression: workflow expressions are evaluated before the 1Password
      # step runs, so an expression here would resolve to an empty string.
      - name: Publish CLI
        if: needs.plan.outputs.cli == 'true'
        run: |
          export NODE_AUTH_TOKEN="$NPM_TOKEN"
          npm publish -w @easytocloud/claude-personae --access public

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" --generate-notes

      # `if` blocks rather than `[ ... ] && echo`: Actions runs this with
      # `bash -eo pipefail`, so a false test as the last command in the group
      # would exit non-zero and fail the step -- after a successful publish.
      # That triggers on any single-artifact release (ext-v* or cli-v*).
      - name: Summary
        env:
          PUBLISH_EXT: ${{ needs.plan.outputs.extension }}
          PUBLISH_CLI: ${{ needs.plan.outputs.cli }}
          TAG: ${{ github.ref_name }}
        run: |
          {
            echo "### Published"
            if [ "$PUBLISH_EXT" = "true" ]; then
              echo "- Extension \`$(node -p "require('./extension/package.json').version")\`"
            fi
            if [ "$PUBLISH_CLI" = "true" ]; then
              echo "- CLI \`$(node -p "require('./cli/package.json').version")\`"
            fi
            echo ""
            echo "Tag: \`$TAG\`"
          } >> "$GITHUB_STEP_SUMMARY"
